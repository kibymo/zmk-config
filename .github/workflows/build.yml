name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: nice_nano_v2
            shield: cradio_left
          - board: nice_nano_v2
            shield: cradio_right
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: ZMK Setup
      uses: zmkfirmware/zephyr-west-action@0.2.1

    - name: Build
      run: |
        west build -p always \
          -b ${{ matrix.board }} \
          -- -DSHIELD=${{ matrix.shield }} \
          --no-sysbuild
      shell: bash

    - name: Package Firmware
      run: |
        FIRMWARE=$(find build -name "zephyr*.uf2" | head -1)
        zip -j cradio-${{ matrix.shield }}.zip "$FIRMWARE"

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.shield }}
        path: cradio-${{ matrix.shield }}.zip
        retention-days: 90

